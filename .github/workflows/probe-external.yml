          if ! python3 /tmp/build_json.py; then
            printf '{"error":"json_builder_failed","note":"text output is still complete"}\n' > probe-results/probe-results.json
          fi

          # --- Display output ---
          cat probe-results/probe-output.txt
          echo ""
          echo "=== JSON output ==="
          cat probe-results/probe-results.json

      - name: Upload probe results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-probe-results
          path: probe-results/
          retention-days: 14
