name: Boardgame Club - Visual QA

on:
  workflow_dispatch:
  # Optional daily refresh (comment out if not desired):
  # schedule:
  #   - cron: '0 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  probe:
    name: Network probe (runner -> site)
    runs-on: ubuntu-latest
    outputs:
      reachable: ${{ steps.probe.outputs.reachable }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run network probe
        id: probe
        run: node scripts/probe-network.mjs
      - name: Upload probe result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-probe
          path: output/network-probe.json
          if-no-files-found: ignore
          retention-days: 14

  capture:
    name: Playwright capture
    needs: probe
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download probe result
        uses: actions/download-artifact@v4
        with:
          name: network-probe
          path: output
        continue-on-error: true
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run capture
        run: npm run capture
      - name: Build gallery
        run: npm run gallery
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    name: Deploy to GitHub Pages
    needs: capture
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
